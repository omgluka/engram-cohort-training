<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engram · Model Context Protocol Knowledge Check</title>

<!--
  Workshop 03 · MCP
  Source: anthropic docs (modelcontextprotocol.io, docs.claude.com) + paullarionov where applicable.
  Authored fresh for the Engram cohort.
-->

<!-- Engram fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper:  #F6F4EF;
    --ink:    #0A0A0A;
    --orange: #E8623C;
    --rule:   1.5px;

    --display-machine:   'Doto', monospace;
    --display-editorial: 'Clash Display', 'Geist', sans-serif;
    --mono:              'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:              'Geist', 'Inter', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.5;
    min-height: 100vh;
    padding: 56px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding-bottom: 36px;
    border-bottom: var(--rule) solid var(--ink);
    margin-bottom: 56px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 18px;
  }
  .kiss { line-height: 0.78; }
  .kiss .m {
    font-family: var(--display-machine);
    font-weight: 900;
    letter-spacing: -0.02em;
    font-size: 56px;
    display: block;
  }
  .kiss .e {
    font-family: var(--display-editorial);
    font-weight: 700;
    letter-spacing: -0.045em;
    font-size: 96px;
    display: block;
    margin-top: 0;
  }
  .kiss .e .o { color: var(--orange); }

  .meta {
    text-align: right;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    line-height: 1.7;
    opacity: 0.75;
  }
  .meta .o { color: var(--orange); }
  .meta strong { font-weight: 500; opacity: 1; color: var(--ink); }

  .picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-bottom: 36px;
  }
  .pick-card {
    border: 3px solid var(--ink);
    background: var(--paper);
    padding: 36px 32px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
    text-align: left;
    font-family: var(--sans);
    font-size: 16px;
    letter-spacing: 0;
    text-transform: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 18px;
    font-weight: 400;
  }
  .pick-card:hover { transform: translateY(-2px); background: var(--ink); color: var(--paper); }
  .pick-card:hover .count { color: var(--paper); opacity: 0.6; }
  .pick-card:hover .name { color: var(--paper); }
  .pick-card:hover .name .o { color: var(--orange); }
  .pick-card:hover .desc { color: var(--paper); opacity: 0.85; }
  .pick-card .count {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  .pick-card .name {
    font-family: var(--display-editorial);
    font-weight: 700;
    font-size: 36px;
    letter-spacing: -0.025em;
    line-height: 0.95;
  }
  .pick-card .name .o { color: var(--orange); }
  .pick-card .desc {
    font-family: var(--sans);
    font-weight: 300;
    font-size: 14.5px;
    line-height: 1.45;
    opacity: 0.85;
  }

  .progress-wrap {
    border: 1.5px solid var(--ink);
    height: 14px;
    margin-bottom: 36px;
    position: relative;
  }
  .progress-bar { height: 100%; background: var(--orange); width: 0%; transition: width 0.3s ease; }
  .progress-label {
    position: absolute;
    right: 0;
    top: 22px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0.65;
  }

  .card {
    border-top: var(--rule) solid var(--ink);
    border-bottom: var(--rule) solid var(--ink);
    padding: 56px 0 64px;
  }
  .qmeta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 24px;
  }
  .qmeta .tag { padding: 6px 12px; border: 1.5px solid var(--ink); opacity: 1; }
  .qmeta .tag.basics { color: var(--ink); }
  .qmeta .tag.scenarios { color: var(--orange); border-color: var(--orange); }
  .qmeta .tag.anatomy { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  .qtext {
    font-family: var(--display-editorial);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.02em;
    line-height: 1.22;
    margin-bottom: 36px;
  }
  .qtext code {
    font-family: var(--mono);
    font-size: 0.85em;
    background: rgba(10,10,10,0.06);
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 500;
  }

  .opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .opt {
    display: grid;
    grid-template-columns: 56px 1fr;
    align-items: start;
    min-height: 96px;
    padding: 22px 26px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    line-height: 1.45;
    transition: background 0.1s ease, transform 0.1s ease;
    text-align: left;
    color: inherit;
  }
  .opt code {
    font-family: var(--mono);
    font-size: 0.9em;
    background: rgba(10,10,10,0.06);
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 500;
  }
  .opt:not(.disabled):hover { background: var(--ink); color: var(--paper); border-color: var(--ink); transform: translateX(2px); }
  .opt:not(.disabled):hover code { background: rgba(255,255,255,0.12); }
  .opt:not(.disabled):hover .key { color: var(--orange); opacity: 1; }
  .opt .key {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    opacity: 0.55;
    padding-top: 2px;
  }
  .opt.correct {
    background: #15803d;
    color: #ffffff;
    border-color: #15803d;
  }
  .opt.correct code { background: rgba(255,255,255,0.18); }
  .opt.correct .key { color: #ffffff; opacity: 0.95; }
  .opt.wrong {
    background: #b91c1c;
    color: #ffffff;
    border-color: #b91c1c;
  }
  .opt.wrong code { background: rgba(255,255,255,0.18); }
  .opt.wrong .key { color: #ffffff; opacity: 0.95; }
  .opt.disabled { cursor: default; }
  .opt.disabled:hover { transform: none; background: var(--paper); }
  .opt.correct.disabled:hover { background: #15803d; color: #ffffff; }
  .opt.wrong.disabled:hover { background: #b91c1c; color: #ffffff; }

  .explain {
    margin-top: 28px;
    padding: 28px 32px;
    border-left: 4px solid var(--orange);
    background: #EFEDE7;
    font-family: var(--sans);
    font-size: 15.5px;
    line-height: 1.55;
    display: none;
  }
  .explain code {
    font-family: var(--mono);
    font-size: 0.9em;
    background: rgba(10,10,10,0.08);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .explain.show { display: block; }
  .explain .verdict {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .explain.right { border-left-color: #15803d; }
  .explain.right .verdict { color: #15803d; }
  .explain.right .verdict::before { content: '✓ correct · '; color: #15803d; }
  .explain.miss { border-left-color: #b91c1c; }
  .explain.miss .verdict { color: #b91c1c; }
  .explain.miss .verdict::before { content: '✗ not quite · '; color: #b91c1c; }
  .explain .src {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    opacity: 0.55;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 36px;
    gap: 16px;
  }
  button {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 18px 30px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.12s ease, transform 0.1s ease;
    font-weight: 500;
  }
  button:hover:not(:disabled) { background: var(--ink); color: var(--paper); transform: translateY(-1px); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:hover:not(:disabled) { background: var(--orange); border-color: var(--orange); color: var(--paper); }

  .results {
    padding: 56px 0;
  }
  .score-line {
    display: flex;
    justify-content: space-between;
    align-items: end;
    padding-bottom: 36px;
    border-bottom: var(--rule) solid var(--ink);
    margin-bottom: 36px;
  }
  .score-big {
    font-family: var(--display-editorial);
    font-weight: 700;
    font-size: 160px;
    letter-spacing: -0.045em;
    line-height: 0.85;
  }
  .score-big .total { color: var(--orange); }
  .score-pct {
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: 0.04em;
    text-align: right;
    opacity: 0.85;
  }
  .score-pct .num {
    font-family: var(--display-editorial);
    font-weight: 600;
    font-size: 48px;
    letter-spacing: -0.025em;
    display: block;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .verdict-line {
    font-family: var(--display-editorial);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.025em;
    margin-bottom: 40px;
    max-width: 720px;
    line-height: 1.25;
  }
  .verdict-line .o { color: var(--orange); }

  .review-head {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 18px;
  }
  .review-item {
    display: grid;
    grid-template-columns: 56px 1fr 80px;
    align-items: start;
    gap: 18px;
    padding: 18px 0;
    border-top: 1.5px solid rgba(10,10,10,0.18);
    font-size: 15px;
    line-height: 1.4;
  }
  .review-item .num {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.55;
  }
  .review-item .mark {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: right;
  }
  .review-item.ok .mark { color: var(--ink); }
  .review-item.ok .mark::before { content: '✓ '; color: var(--orange); }
  .review-item.bad .mark { color: var(--orange); }
  .review-item.bad .mark::before { content: '✗ '; }

  .results-controls { display: flex; gap: 16px; margin-top: 40px; }

  footer {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1.5px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    opacity: 0.65;
  }
  .mark-engram {
    display: inline-flex; align-items: center; gap: 10px;
  }
  .mark-engram svg { display: block; height: 20px; }

  .hint {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    opacity: 0.5;
    margin-top: 18px;
    text-align: center;
  }
  kbd {
    font-family: var(--mono);
    border: 1px solid var(--ink);
    padding: 1px 7px;
    font-size: 11px;
    opacity: 0.75;
  }

  .hidden { display: none !important; }

  @media (max-width: 760px) {
    body { padding: 32px 20px; }
    .kiss .m { font-size: 36px; }
    .kiss .e { font-size: 60px; }
    .picker { grid-template-columns: 1fr; }
    .opts { grid-template-columns: 1fr; }
    .qtext { font-size: 22px; }
    .score-big { font-size: 96px; }
  }
/* === src-badge styles (added by add-badges.js) === */
  .src-badge {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1px solid var(--ink);
    margin-left: 10px;
    background: var(--paper);
    color: var(--ink);
    opacity: 0.75;
  }
  .src-badge.verified-anthropic {
    color: #15803D;
    border-color: #15803D;
    background: #ECFAF1;
    opacity: 1;
  }
  .src-badge.verified-anthropic::before { content: '✓ '; }
  .src-badge.verified-cyberskill {
    color: var(--ink);
    border-color: var(--ink);
    opacity: 0.85;
  }
  .src-badge.verified-paul {
    color: var(--ink);
    border-color: var(--ink);
    opacity: 0.85;
  }
  .src-badge.verified-debated {
    color: #B47A00;
    border-color: #B47A00;
    background: #FFF7E0;
    opacity: 1;
  }
  .src-badge.verified-debated::before { content: '⚠ '; }
  .docs-link {
    display: block;
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #15803D;
    text-decoration: none;
    border-bottom: 1px solid #15803D;
    padding-bottom: 2px;
  }
  .docs-link::before { content: '→ anthropic docs: '; opacity: 0.7; }
  .docs-link:hover { color: var(--orange); border-color: var(--orange); }

</style>
</head>
<body>
<div class="wrap">

  <a href="../../index.html" style="font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; color: var(--ink); text-decoration: none; display: inline-block; margin-bottom: 32px;" onmouseover="this.style.color='var(--orange)';this.style.opacity='1'" onmouseout="this.style.color='var(--ink)';this.style.opacity='0.55'">← all workshops</a>

  <header>
    <div>
      <div class="eyebrow">engram · cohort training · workshop 03</div>
      <div class="kiss">
        <span class="m">mcp</span>
        <span class="e">protocol<span class="o">.</span></span>
      </div>
    </div>
    <div class="meta">
      <strong>33 questions</strong> · <span class="o">3 sets</span><br/>
      authored from anthropic docs<br/>
      plus paullarionov verbatim
    </div>
  </header>

  <section id="picker" class="picker">
    <button class="pick-card" data-mode="basics">
      <div class="count">set 01 · 11 questions</div>
      <div class="name">Basics<span class="o">.</span></div>
      <div class="desc">What MCP is and why. Tools, resources, prompts. Client/server roles. Transports. Capability negotiation.</div>
    </button>
    <button class="pick-card" data-mode="scenarios">
      <div class="count">set 02 · 12 questions</div>
      <div class="name">Scenarios<span class="o">.</span></div>
      <div class="desc">Production situations. Misrouted tool calls, server misconfig, isError flag, OAuth for remote servers, when to write an MCP server vs a skill.</div>
    </button>
    <button class="pick-card" data-mode="anatomy">
      <div class="count">set 03 · 10 questions</div>
      <div class="name">Anatomy<span class="o">.</span></div>
      <div class="desc">CCAF-style architecture. Tool annotations, structured output, sampling, elicitation, scopes (project vs user vs plugin), version handling.</div>
    </button>
  </section>

  <button class="pick-card" id="pickAll" style="grid-column: 1/-1; width: 100%; margin-bottom: 40px; align-items: center; text-align: center;">
    <div class="count">all sets · 33 questions, shuffled</div>
    <div class="name">Workshop mode<span class="o">.</span></div>
    <div class="desc" style="max-width: 600px; margin: 0 auto;">Go through everything in one run. Keyboard nav: <kbd>1</kbd>–<kbd>4</kbd> to pick, <kbd>→</kbd> next, <kbd>←</kbd> back.</div>
  </button>

  <div id="progressWrap" class="progress-wrap hidden">
    <div class="progress-bar" id="progressBar"></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>

  <section id="card" class="card hidden"></section>

  <div class="hint" id="hint">tip · press <kbd>1</kbd>–<kbd>4</kbd> to answer · <kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>R</kbd> restart</div>

  <footer>
    <div>engram · agentic media. · 2026</div>
    <div class="mark-engram">
      <svg viewBox="0 0 242.82 100" aria-label="Engram">
        <rect x="0" y="0" width="118.5" height="29.85" fill="#0A0A0A"/>
        <rect x="0" y="35.075" width="118.5" height="29.85" fill="#0A0A0A"/>
        <rect x="0" y="70.15" width="118.5" height="29.85" fill="#0A0A0A"/>
        <rect x="124.12" y="0" width="35.4" height="100" fill="#0A0A0A"/>
        <rect x="165.77" y="0" width="35.4" height="100" fill="#0A0A0A"/>
        <rect x="207.42" y="0" width="35.4" height="100" fill="#0A0A0A"/>
      </svg>
    </div>
  </footer>

</div>

<script>

/* ════════════════════════════════════════
   BASICS · 11 verified questions
   Source: anthropic docs + paullarionov guide_en.MD
   ════════════════════════════════════════ */
const MCP_BASICS = [
  {
    tag: "basics",
    q: "What does the Model Context Protocol (MCP) standardize?",
    opts: [
      "A way for AI applications (hosts) to connect to external data sources, tools, and workflow templates",
      "A binary wire format for streaming model weights between GPUs",
      "A registry of approved LLM providers that Anthropic certifies",
      "A prompt-engineering DSL that compiles to system prompts",
    ],
    answer: 0,
    explain: "<strong>Why A:</strong> MCP is an open-source standard for connecting AI applications to external systems (data, tools, workflows). It is often described as a USB-C port for AI apps. It is not a wire format for weights, not a provider registry, and not a prompt DSL.",
    source: "anthropic docs · modelcontextprotocol.io introduction",
    verified: "anthropic",
    docsLink: "https://modelcontextprotocol.io/introduction",
  },
  {
    tag: "basics",
    q: "Which three primitives does an MCP server expose to clients?",
    opts: [
      "Tools, Resources, and Prompts",
      "Functions, Files, and Roles",
      "Actions, Schemas, and Embeddings",
      "Commands, Triggers, and Workflows",
    ],
    answer: 0,
    explain: "<strong>Why A:</strong> The MCP specification defines exactly three server-side primitives: Tools (functions the model can call), Resources (data the model can read for context), and Prompts (templated messages and workflows). The other labels are paraphrases that do not match the spec.",
    source: "paullarionov Q · MCP chapter 4.1",
    verified: "anthropic",
    docsLink: "https://modelcontextprotocol.io/docs/concepts/architecture",
  },
  {
    tag: "basics",
    q: "In MCP terminology, what is a Host?",
    opts: [
      "The LLM application that initiates connections and contains one or more clients",
      "The cloud server that runs the LLM weights",
      "The user's operating system",
      "Any process that exposes tools and resources",
    ],
    answer: 0,
    explain: "<strong>Why A:</strong> The spec defines three roles: Hosts (LLM apps that initiate connections), Clients (connectors inside the host), and Servers (services that provide context and capabilities). A process that exposes tools is a Server, not a Host.",
    source: "anthropic docs · modelcontextprotocol.io specification",
    verified: "anthropic",
    docsLink: "https://modelcontextprotocol.io/docs/concepts/architecture",
  },
  {
    tag: "basics",
    q: "Which message format does MCP use on the wire?",
    opts: [
      "JSON-RPC 2.0",
      "gRPC with Protocol Buffers",
      "GraphQL over WebSocket",
      "Plain REST with JSON bodies",
    ],
    answer: 0,
    explain: "<strong>Why A:</strong> MCP uses JSON-RPC 2.0 messages over stateful connections, with capability negotiation between client and server. It is not gRPC, GraphQL, or REST.",
    source: "anthropic docs · modelcontextprotocol.io specification",
    verified: "anthropic",
    docsLink: "https://modelcontextprotocol.io/docs/concepts/transports",
  },
  {
    tag: "basics",
    q: "Which transports are defined by the current MCP specification?",
    opts: [
      "stdio for local servers and Streamable HTTP for remote servers",
      "Only WebSocket connections",
      "Only stdio, remote servers are out of scope",
      "Bluetooth and Zeroconf mDNS",
    ],
    answer: 0,
    explain: "<strong>Why A:</strong> MCP defines stdio (local subprocess) and Streamable HTTP (the newer remote transport that supersedes the older SSE transport) as standard. WebSocket-only and stdio-only are both wrong, and Bluetooth/mDNS are not MCP transports.",
    source: "anthropic docs · modelcontextprotocol.io transports",
    verified: "anthropic",
    docsLink: "https://modelcontextprotocol.io/docs/concepts/transports",
  },
  {
    tag: "basics",
    q: "Why was MCP created instead of letting each AI app define its own tool-integration format?",

let QUESTIONS = [];
let current = 0;
let answers = [];

const picker = document.getElementById('picker');
const pickAll = document.getElementById('pickAll');
const card = document.getElementById('card');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');
const hint = document.getElementById('hint');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startSet(mode) {
  if (mode === 'basics') QUESTIONS = MCP_BASICS;
  else if (mode === 'scenarios') QUESTIONS = MCP_SCENARIOS;
  else if (mode === 'anatomy') QUESTIONS = MCP_ANATOMY;
  else QUESTIONS = shuffle(MCP_BASICS.concat(MCP_SCENARIOS).concat(MCP_ANATOMY));
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  picker.classList.add('hidden');
  pickAll.classList.add('hidden');
  progressWrap.classList.remove('hidden');
  card.classList.remove('hidden');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showPicker() {
  picker.classList.remove('hidden');
  pickAll.classList.remove('hidden');
  progressWrap.classList.add('hidden');
  card.classList.add('hidden');
  current = 0;
  answers = [];
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const i = current;
  const item = QUESTIONS[i];
  const answered = answers[i] !== null;
  progressBar.style.width = `${((i + (answered ? 1 : 0)) / QUESTIONS.length) * 100}%`;
  progressLabel.textContent = `${i + 1} / ${QUESTIONS.length}`;

  const tagClass = item.tag;
  const tagLabel = item.tag === 'scenarios' ? 'scenario' : item.tag === 'anatomy' ? 'anatomy' : 'basics';

  card.innerHTML = `
    <div class="qmeta">
      <span>Question ${i + 1} of ${QUESTIONS.length}</span>
      <span class="tag ${tagClass}">${tagLabel}</span>
      ${item.verified ? `<span class="src-badge verified-${item.verified}">${item.verified === 'anthropic-corrected' ? 'anthropic *' : item.verified === 'debated' ? 'community-debated' : item.verified === 'paul' ? 'paullarionov' : item.verified}</span>` : ''} /* render: src-badge */
    </div>
    <div class="qtext">${item.q}</div>
    <div class="opts">
      ${item.opts.map((opt, j) => {
        let cls = '';
        if (answered) {
          if (j === item.answer) cls = 'correct';
          else if (j === answers[i]) cls = 'wrong';
        }
        return `<button class="opt ${cls} ${answered ? 'disabled' : ''}" data-opt="${j}" ${answered ? 'disabled' : ''}>
          <span class="key">0${j + 1}</span>
          <span>${opt}</span>
        </button>`;
      }).join('')}
    </div>
    ${answered ? `
      <div class="explain show ${answers[i] === item.answer ? 'right' : 'miss'}">
        <div class="verdict">why</div>
        ${item.explain}
        ${item.docsLink ? `<a class="docs-link" href="${item.docsLink}" target="_blank" rel="noopener">${item.docsLink}</a>` : ''} /* render: docs-link */
        <div class="src">source · ${item.source}</div>
      </div>` : '<div class="explain"></div>'}
    <div class="controls">
      <button id="prevBtn" ${i === 0 ? 'disabled' : ''}>← back</button>
      <button class="primary" id="nextBtn" ${!answered ? 'disabled' : ''}>
        ${i === QUESTIONS.length - 1 ? 'finish →' : 'next →'}
      </button>
    </div>
  `;

  card.querySelectorAll('.opt').forEach(el => {
    if (el.classList.contains('disabled')) return;
    el.addEventListener('click', () => {
      const j = parseInt(el.dataset.opt, 10);
      answers[i] = j;
      renderQuestion();
    });
  });

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.onclick = () => { if (current > 0) { current--; renderQuestion(); } };
  nextBtn.onclick = () => {
    if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
    else renderResults();
  };
}

function renderResults() {
  progressBar.style.width = '100%';
  progressLabel.textContent = `${QUESTIONS.length} / ${QUESTIONS.length}`;
  hint.classList.add('hidden');
  const correct = answers.filter((a, i) => a === QUESTIONS[i].answer).length;
  const pct = Math.round((correct / QUESTIONS.length) * 100);
  const verdict = pct === 100 ? "Perfect score. Ready for submission."
    : pct >= 80 ? "Strong grasp. Worth one review pass on the misses."
    : pct >= 60 ? "Solid start. Read the misses, then run it again."
    : "Worth another pass through the material before workshop.";

  card.innerHTML = `
    <div class="results">
      <div class="score-line">
        <div class="score-big">${correct}<span class="total"> / ${QUESTIONS.length}</span></div>
        <div class="score-pct"><span class="num">${pct}%</span>final score</div>
      </div>

      <div class="verdict-line">${verdict.replace('.', '<span class="o">.</span>')}</div>

      <div class="review-head">review · what you got</div>
      ${QUESTIONS.map((item, i) => {
        const ok = answers[i] === item.answer;
        return `<div class="review-item ${ok ? 'ok' : 'bad'}">
          <div class="num">0${(i + 1).toString().padStart(2, '0').slice(-2)}</div>
          <div>${item.q}</div>
          <div class="mark">${ok ? 'ok' : 'miss'}</div>
        </div>`;
      }).join('')}

      <div class="results-controls">
        <button id="restartBtn" class="primary">try again</button>
        <button id="pickerBtn">change set</button>
      </div>
    </div>
  `;
  document.getElementById('restartBtn').onclick = () => {
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    hint.classList.remove('hidden');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('pickerBtn').onclick = () => {
    hint.classList.remove('hidden');
    showPicker();
  };
}

picker.querySelectorAll('.pick-card').forEach(el => {
  el.addEventListener('click', () => startSet(el.dataset.mode));
});
pickAll.addEventListener('click', () => startSet('all'));

document.addEventListener('keydown', e => {
  if (card.classList.contains('hidden')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key >= '1' && e.key <= '4') {
    const j = parseInt(e.key, 10) - 1;
    const item = QUESTIONS[current];
    if (item && answers[current] === null && j < item.opts.length) {
      answers[current] = j;
      renderQuestion();
    }
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn && !nextBtn.disabled) nextBtn.click();
  } else if (e.key === 'ArrowLeft') {
    const prevBtn = document.getElementById('prevBtn');
    if (prevBtn && !prevBtn.disabled) prevBtn.click();
  } else if (e.key === 'r' || e.key === 'R') {
    showPicker();
  }
});
</script>
</body>
</html>
