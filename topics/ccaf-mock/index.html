<style>
  :root {
    --paper:  #F6F4EF;
    --ink:    #0A0A0A;
    --orange: #E8623C;
    --rule:   1.5px;

    --display-machine:   'Doto', monospace;
    --display-editorial: 'Clash Display', 'Geist', sans-serif;
    --mono:              'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:              'Geist', 'Inter', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.5;
    min-height: 100vh;
    padding: 56px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding-bottom: 36px;
    border-bottom: var(--rule) solid var(--ink);
    margin-bottom: 56px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 18px;
  }
  .kiss { line-height: 0.78; }
  .kiss .m {
    font-family: var(--display-machine);
    font-weight: 900;
    letter-spacing: -0.02em;
    font-size: 56px;
    display: block;
  }
  .kiss .e {
    font-family: var(--display-editorial);
    font-weight: 700;
    letter-spacing: -0.045em;
    font-size: 96px;
    display: block;
    margin-top: 0;
  }
  .kiss .e .o { color: var(--orange); }

  .meta {
    text-align: right;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    line-height: 1.7;
    opacity: 0.75;
  }
  .meta .o { color: var(--orange); }
  .meta strong { font-weight: 500; opacity: 1; color: var(--ink); }

  .picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

  }

    padding: 28px 24px;

    letter-spacing: 0;

    color: inherit;

    flex-direction: column;

  }
  .pick-card:hover { transform: translateY(-2px); background: var(--ink); color: var(--paper); }

  .pick-card:hover .name { color: var(--paper); }

  .pick-card .count {

  .pick-card .name {

    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.025em;

  .pick-card .name .o { color: var(--orange); }
  .pick-card .desc {

    line-height: 1.4;
    opacity: 0.85;
  }

  .progress-wrap {

<script>

/* ════════════════════════════════════════
   QUESTION BANK · 60 verbatim from CyberSkill mock
   Source: claude-certified-architect-mock-exam-cyberskill.vercel.app
   ════════════════════════════════════════ */
const RESEARCH = [
  {
    tag: "research",
    q: "Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analysis agent had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings. What state management approach best balances information fidelity with context efficiency when restoring agent state?",
    opts: [
      "Have each agent maintain its own persistent state file and reload it independently at the start of each session.",
      "Persist the coordinator's conversation log containing all task delegations and responses, providing this to agents when resuming.",
      "Have each agent persist a structured report to a known location. On resume, the coordinator loads the reports and injects relevant state into agent prompts.",
      "Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings.",
    ],
    answer: 2,
    explain: "<strong>Why C:</strong> Correct. Structured per-agent reports keep fidelity (the findings, with schema), let the coordinator stay in charge of orchestration, and keep each subagent's context focused. This is the orchestrator + compact artifact pattern.<br/><br/><strong>A:</strong> Fragmented per-agent state breaks coordinator visibility and makes cross-agent reasoning brittle. Each agent reloading unrelated internal state also bloats their context with noise they don't need.<br/><br/><strong>B:</strong> A full conversation log is the highest-fidelity but least context-efficient option. You'd replay everything into each subagent and blow past context budgets.<br/><br/><strong>D:</strong> Semantic retrieval over agent outputs is overkill for resuming a crashed pipeline, it adds a retrieval failure mode and can miss precise state that a structured report preserves exactly.",
    source: "CyberSkill mock Q1"
  },
  {
    tag: "research",
    q: "After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with proper source citations. What context-passing strategy provides the best balance of completeness and efficiency?",
    opts: [
      "Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated.",
      "Pass the synthesis draft along with a structured source index that maps key claims to their source URLs and relevant excerpts.",
      "Pass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only.",
      "Pass the full accumulated context from all prior agents.",
    ],
    answer: 1,
    explain: "<strong>Why B:</strong> Correct. The synthesis gives the narrative; the source index gives the report generator exactly the binding it needs to cite without re-reading 120K tokens of raw content.<br/><br/><strong>A:</strong> Post-hoc matching is fragile, without the mapping the model used, you can't reliably bind claims to the right source. Hallucinated or misattributed citations are the usual failure mode.<br/><br/><strong>C:</strong> Name-only attribution loses URLs and excerpts, so the report generator can't quote or verify, and 'by name only' tends to drift into vague citations.<br/><br/><strong>D:</strong> Maximum completeness but wasteful, 120K+ tokens of raw search content is mostly irrelevant noise at the report-generation stage.",
    source: "CyberSkill mock Q2"
  },
  {
    tag: "research",
    q: "The document analysis agent has a single <code>analyze_document</code> tool that takes a document and a free-text instruction parameter. During evaluation, requests like &quot;extract the key financial metrics&quot; often return narrative summaries, while &quot;summarize the methodology&quot; sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions. What's the most effective way to improve reliability?",
    opts: [
      "Split the generic tool into purpose-specific tools, <code>extract_data_points</code>, <code>summarize_content</code>, <code>verify_claim_against_source</code>, each with defined input/output contracts.",
      "Keep the single tool but add an <code>analysis_type</code> enum parameter requiring explicit selection between extraction, summarization, and verification modes.",
      "Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent.",
      "Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats.",
    ],
    answer: 0,
    explain: "<strong>Why A:</strong> Correct. Free-text instructions put the semantics in prose, which the model interprets inconsistently. Purpose-specific tools give the model an explicit, well-typed contract to pick between.<br/><br/><strong>B:</strong> Better than free text, but still a single tool with a single output shape. Output still has to be a generic string, and the model can mode-mismatch. Separate tools enforce distinct I/O contracts.<br/><br/><strong>C:</strong> Moves the ambiguity upstream without fixing it. The tool contract is still fuzzy; the coordinator's classification is one more error surface.<br/><br/><strong>D:</strong> Examples help, but tool-use reliability comes first from clear tool boundaries and output schemas, not from heroic prompt engineering on one generic tool.",
    source: "CyberSkill mock Q3"
  },
  {
    tag: "research",
    q: "The web search agent has gathered several relevant sources for a research topic. The document analysis agent now needs to examine these sources. How does information typically flow between these two specialized subagents?",
    opts: [
      "The agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events.",
      "The web search agent directly invokes the document analysis agent, passing the discovered sources as parameters.",
      "The coordinator agent receives the web search agent's output and includes relevant findings in the prompt when invoking the document analysis agent.",
      "Both agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them.",

let QUESTIONS = [];
let current = 0;
let answers = [];

const picker = document.getElementById('picker');
const pickAll = document.getElementById('pickAll');
const card = document.getElementById('card');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');
const hint = document.getElementById('hint');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startSet(mode) {
  if (mode === 'research') QUESTIONS = RESEARCH;
  else if (mode === 'code') QUESTIONS = CODE;
  else if (mode === 'support') QUESTIONS = SUPPORT;
  else if (mode === 'extract') QUESTIONS = EXTRACT;
  else QUESTIONS = shuffle(RESEARCH.concat(CODE).concat(SUPPORT).concat(EXTRACT));
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  picker.classList.add('hidden');
  pickAll.classList.add('hidden');
  progressWrap.classList.remove('hidden');
  card.classList.remove('hidden');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showPicker() {
  picker.classList.remove('hidden');
  pickAll.classList.remove('hidden');
  progressWrap.classList.add('hidden');
  card.classList.add('hidden');
  current = 0;
  answers = [];
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const i = current;
  const item = QUESTIONS[i];
  const answered = answers[i] !== null;
  progressBar.style.width = `${((i + (answered ? 1 : 0)) / QUESTIONS.length) * 100}%`;
  progressLabel.textContent = `${i + 1} / ${QUESTIONS.length}`;

  const tagLabel = item.tag === 'code' ? 'code' : item.tag === 'support' ? 'support' : item.tag === 'extract' ? 'extract' : 'research';

  card.innerHTML = `
    <div class="qmeta">
      <span>Question ${i + 1} of ${QUESTIONS.length}</span>
      <span class="tag ${item.tag}">${tagLabel}</span>
    </div>
    <div class="qtext">${item.q}</div>
    <div class="opts">
      ${item.opts.map((opt, j) => {
        let cls = '';
        if (answered) {
          if (j === item.answer) cls = 'correct';
          else if (j === answers[i]) cls = 'wrong';
        }
        return `<button class="opt ${cls} ${answered ? 'disabled' : ''}" data-opt="${j}" ${answered ? 'disabled' : ''}>
          <span class="key">0${j + 1}</span>
          <span>${opt}</span>
        </button>`;
      }).join('')}
    </div>
    ${answered ? `
      <div class="explain show ${answers[i] === item.answer ? 'right' : 'miss'}">
        <div class="verdict">why</div>
        ${item.explain}
        <div class="src">source &middot; ${item.source}</div>
      </div>` : '<div class="explain"></div>'}
    <div class="controls">
      <button id="prevBtn" ${i === 0 ? 'disabled' : ''}>&larr; back</button>
      <button class="primary" id="nextBtn" ${!answered ? 'disabled' : ''}>
        ${i === QUESTIONS.length - 1 ? 'finish &rarr;' : 'next &rarr;'}
      </button>
    </div>
  `;

  card.querySelectorAll('.opt').forEach(el => {
    if (el.classList.contains('disabled')) return;
    el.addEventListener('click', () => {
      const j = parseInt(el.dataset.opt, 10);
      answers[i] = j;
      renderQuestion();
    });
  });

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.onclick = () => { if (current > 0) { current--; renderQuestion(); } };
  nextBtn.onclick = () => {
    if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
    else renderResults();
  };
}

function renderResults() {
  progressBar.style.width = '100%';
  progressLabel.textContent = `${QUESTIONS.length} / ${QUESTIONS.length}`;
  hint.classList.add('hidden');
  const correct = answers.filter((a, i) => a === QUESTIONS[i].answer).length;
  const pct = Math.round((correct / QUESTIONS.length) * 100);
  const verdict = pct === 100 ? "Perfect score. Ready for submission."
    : pct >= 80 ? "Strong grasp. Worth one review pass on the misses."
    : pct >= 60 ? "Solid start. Read the misses, then run it again."
    : "Worth another pass through the material before workshop.";

  card.innerHTML = `
    <div class="results">
      <div class="score-line">
        <div class="score-big">${correct}<span class="total"> / ${QUESTIONS.length}</span></div>
        <div class="score-pct"><span class="num">${pct}%</span>final score</div>
      </div>

      <div class="verdict-line">${verdict.replace('.', '<span class="o">.</span>')}</div>

      <div class="review-head">review &middot; what you got</div>
      ${QUESTIONS.map((item, i) => {
        const ok = answers[i] === item.answer;
        return `<div class="review-item ${ok ? 'ok' : 'bad'}">
          <div class="num">0${(i + 1).toString().padStart(2, '0').slice(-2)}</div>
          <div>${item.q}</div>
          <div class="mark">${ok ? 'ok' : 'miss'}</div>
        </div>`;
      }).join('')}

      <div class="results-controls">
        <button id="restartBtn" class="primary">try again</button>
        <button id="pickerBtn">change set</button>
      </div>
    </div>
  `;
  document.getElementById('restartBtn').onclick = () => {
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    hint.classList.remove('hidden');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('pickerBtn').onclick = () => {
    hint.classList.remove('hidden');
    showPicker();
  };
}

picker.querySelectorAll('.pick-card').forEach(el => {
  el.addEventListener('click', () => startSet(el.dataset.mode));
});
pickAll.addEventListener('click', () => startSet('all'));

document.addEventListener('keydown', e => {
  if (card.classList.contains('hidden')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key >= '1' && e.key <= '4') {
    const j = parseInt(e.key, 10) - 1;
    const item = QUESTIONS[current];
    if (item && answers[current] === null && j < item.opts.length) {
      answers[current] = j;
      renderQuestion();
    }
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn && !nextBtn.disabled) nextBtn.click();
  } else if (e.key === 'ArrowLeft') {
    const prevBtn = document.getElementById('prevBtn');
    if (prevBtn && !prevBtn.disabled) prevBtn.click();
  } else if (e.key === 'r' || e.key === 'R') {
    showPicker();
  }
});
</script>
</body>
</html>
