<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engram · Skills Knowledge Check</title>

<!-- Engram fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper:  #F6F4EF;
    --ink:    #0A0A0A;
    --orange: #E8623C;
    --rule:   1.5px;

    --display-machine:   'Doto', monospace;
    --display-editorial: 'Clash Display', 'Geist', sans-serif;
    --mono:              'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:              'Geist', 'Inter', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.5;
    min-height: 100vh;
    padding: 56px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ────────── header ────────── */
  header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding-bottom: 36px;
    border-bottom: var(--rule) solid var(--ink);
    margin-bottom: 56px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 18px;
  }
  .kiss { line-height: 0.78; }
  .kiss .m {
    font-family: var(--display-machine);
    font-weight: 900;
    letter-spacing: -0.02em;
    font-size: 56px;
    display: block;
  }
  .kiss .e {
    font-family: var(--display-editorial);
    font-weight: 700;
    letter-spacing: -0.045em;
    font-size: 96px;
    display: block;
    margin-top: 0;
  }
  .kiss .e .o { color: var(--orange); }

  .meta {
    text-align: right;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    line-height: 1.7;
    opacity: 0.75;
  }
  .meta .o { color: var(--orange); }
  .meta strong { font-weight: 500; opacity: 1; color: var(--ink); }

  /* ────────── picker ────────── */
  .picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-bottom: 36px;
  }
  .pick-card {
    border: 3px solid var(--ink);
    background: var(--paper);
    padding: 36px 32px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
    text-align: left;
    font-family: var(--sans);
    font-size: 16px;
    letter-spacing: 0;
    text-transform: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 18px;
    font-weight: 400;
  }
  .pick-card:hover { transform: translateY(-2px); background: var(--ink); color: var(--paper); }
  .pick-card:hover .count { color: var(--paper); opacity: 0.6; }
  .pick-card:hover .name { color: var(--paper); }
  .pick-card:hover .name .o { color: var(--orange); }
  .pick-card:hover .desc { color: var(--paper); opacity: 0.85; }
  .pick-card .count {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  .pick-card .name {
    font-family: var(--display-editorial);
    font-weight: 700;
    font-size: 36px;
    letter-spacing: -0.025em;
    line-height: 0.95;
  }
  .pick-card .name .o { color: var(--orange); }
  .pick-card .desc {
    font-family: var(--sans);
    font-weight: 300;
    font-size: 14.5px;
    line-height: 1.45;
    opacity: 0.85;
  }

  /* ────────── progress ────────── */
  .progress-wrap {
    border: 1.5px solid var(--ink);
    height: 14px;
    margin-bottom: 36px;
    position: relative;
  }
  .progress-bar { height: 100%; background: var(--orange); width: 0%; transition: width 0.3s ease; }
  .progress-label {
    position: absolute;
    right: 0;
    top: 22px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0.65;
  }

  /* ────────── card ────────── */
  .card {
    border-top: var(--rule) solid var(--ink);
    border-bottom: var(--rule) solid var(--ink);
    padding: 56px 0 64px;
  }
  .qmeta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 24px;
  }
  .qmeta .tag { padding: 6px 12px; border: 1.5px solid var(--ink); opacity: 1; }
  .qmeta .tag.basics { color: var(--ink); }
  .qmeta .tag.scenario { color: var(--orange); border-color: var(--orange); }
  .qmeta .tag.anatomy { color: var(--ink); background: var(--ink); color: var(--paper); }
  .qtext {
    font-family: var(--display-editorial);
    font-weight: 600;
    font-size: 32px;
    letter-spacing: -0.02em;
    line-height: 1.18;
    margin-bottom: 36px;
  }

  /* ────────── options ────────── */
  .opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .opt {
    display: grid;
    grid-template-columns: 56px 1fr;
    align-items: start;
    min-height: 96px;
    padding: 22px 26px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    line-height: 1.45;
    transition: background 0.1s ease, transform 0.1s ease;
    text-align: left;
    color: inherit;
  }
  .opt:not(.disabled):hover { background: var(--ink); color: var(--paper); border-color: var(--ink); transform: translateX(2px); }
  .opt:not(.disabled):hover .key { color: var(--orange); opacity: 1; }
  .opt .key {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    opacity: 0.55;
    padding-top: 2px;
  }
  .opt.correct {
    background: #15803d;
    color: #ffffff;
    border-color: #15803d;
  }
  .opt.correct .key { color: #ffffff; opacity: 0.95; }
  .opt.wrong {
    background: #b91c1c;
    color: #ffffff;
    border-color: #b91c1c;
  }
  .opt.wrong .key { color: #ffffff; opacity: 0.95; }
  .opt.disabled { cursor: default; }
  .opt.disabled:hover { transform: none; background: var(--paper); }
  .opt.correct.disabled:hover { background: #15803d; color: #ffffff; }
  .opt.wrong.disabled:hover { background: #b91c1c; color: #ffffff; }

  /* ────────── explain ────────── */
  .explain {
    margin-top: 28px;
    padding: 28px 32px;
    border-left: 4px solid var(--orange);
    background: #EFEDE7;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    display: none;
  }
  .explain.show { display: block; }
  .explain .verdict {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .explain.right { border-left-color: #15803d; }
  .explain.right .verdict { color: #15803d; }
  .explain.right .verdict::before { content: '✓ correct · '; color: #15803d; }
  .explain.miss { border-left-color: #b91c1c; }
  .explain.miss .verdict { color: #b91c1c; }
  .explain.miss .verdict::before { content: '✗ not quite · '; color: #b91c1c; }

  /* ────────── controls ────────── */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 36px;
    gap: 16px;
  }
  button {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 18px 30px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.12s ease, transform 0.1s ease;
    font-weight: 500;
  }
  button:hover:not(:disabled) { background: var(--ink); color: var(--paper); transform: translateY(-1px); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:hover:not(:disabled) { background: var(--orange); border-color: var(--orange); color: var(--paper); }

  /* ────────── results ────────── */
  .results {
    padding: 56px 0;
  }
  .score-line {
    display: flex;
    justify-content: space-between;
    align-items: end;
    padding-bottom: 36px;
    border-bottom: var(--rule) solid var(--ink);
    margin-bottom: 36px;
  }
  .score-big {
    font-family: var(--display-editorial);
    font-weight: 700;
    font-size: 160px;
    letter-spacing: -0.045em;
    line-height: 0.85;
  }
  .score-big .total { color: var(--orange); }
  .score-pct {
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: 0.04em;
    text-align: right;
    opacity: 0.85;
  }
  .score-pct .num {
    font-family: var(--display-editorial);
    font-weight: 600;
    font-size: 48px;
    letter-spacing: -0.025em;
    display: block;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .verdict-line {
    font-family: var(--display-editorial);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.025em;
    margin-bottom: 40px;
    max-width: 720px;
    line-height: 1.25;
  }
  .verdict-line .o { color: var(--orange); }

  .review-head {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 18px;
  }
  .review-item {
    display: grid;
    grid-template-columns: 56px 1fr 80px;
    align-items: start;
    gap: 18px;
    padding: 18px 0;
    border-top: 1.5px solid rgba(10,10,10,0.18);
    font-size: 15px;
    line-height: 1.4;
  }
  .review-item .num {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.55;
  }
  .review-item .mark {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: right;
  }
  .review-item.ok .mark { color: var(--ink); }
  .review-item.ok .mark::before { content: '✓ '; color: var(--orange); }
  .review-item.bad .mark { color: var(--orange); }
  .review-item.bad .mark::before { content: '✗ '; }

  .results-controls { display: flex; gap: 16px; margin-top: 40px; }

  /* ────────── footer ────────── */
  footer {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1.5px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    opacity: 0.65;
  }
  .mark-engram {
    display: inline-flex; align-items: center; gap: 10px;
  }
  .mark-engram svg { display: block; height: 20px; }

  .hint {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    opacity: 0.5;
    margin-top: 18px;
    text-align: center;
  }
  kbd {
    font-family: var(--mono);
    border: 1px solid var(--ink);
    padding: 1px 7px;
    font-size: 11px;
    opacity: 0.75;
  }

  /* hidden state */
  .hidden { display: none !important; }

  /* small screens */
  @media (max-width: 760px) {
    body { padding: 32px 20px; }
    .kiss .m { font-size: 36px; }
    .kiss .e { font-size: 60px; }
    .picker { grid-template-columns: 1fr; }
    .opts { grid-template-columns: 1fr; }
    .qtext { font-size: 24px; }
    .score-big { font-size: 96px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <a href="../../index.html" style="font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; color: var(--ink); text-decoration: none; display: inline-block; margin-bottom: 32px;" onmouseover="this.style.color='var(--orange)';this.style.opacity='1'" onmouseout="this.style.color='var(--ink)';this.style.opacity='0.55'">← all workshops</a>

  <header>
    <div>
      <div class="eyebrow">engram · cohort training · workshop 01</div>
      <div class="kiss">
        <span class="m">skills</span>
        <span class="e">knowledge<span class="o">.</span></span>

    <div class="meta">

      verified from CCAF repo<br/>
      claude-certified-architect/practical_test_skills_en.html
    </div>
  </header>

  <!-- PICKER -->
  <section id="picker" class="picker">
    <button class="pick-card" data-mode="basics">
      <div class="count">set 01 · 10 questions</div>
      <div class="name">Basics<span class="o">.</span></div>
      <div class="desc">SKILL.md anatomy, frontmatter, progressive disclosure, discovery roots, slash command vs skill, subagent vs skill.</div>
    </button>
    <button class="pick-card" data-mode="scenarios">
      <div class="count">set 02 · 10 questions</div>

      <div class="count">set 03 · 11 questions</div>

  <button class="pick-card" id="pickAll" style="grid-column: 1/-1; width: 100%; margin-bottom: 40px; align-items: center; text-align: center;">

    <div class="name">Workshop mode<span class="o">.</span></div>
    <div class="desc" style="max-width: 600px; margin: 0 auto;">Go through everything in one run. Keyboard nav: <kbd>1</kbd>–<kbd>4</kbd> to pick, <kbd>→</kbd> next, <kbd>←</kbd> back.</div>
  </button>

  <!-- QUIZ -->
  <div id="progressWrap" class="progress-wrap hidden">
    <div class="progress-bar" id="progressBar"></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>

  <section id="card" class="card hidden"></section>

  <div class="hint" id="hint">tip · press <kbd>1</kbd>–<kbd>4</kbd> to answer · <kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>R</kbd> restart</div>

  <footer>
    <div>engram · agentic media. · 2026</div>
    <div class="mark-engram">
      <svg viewBox="0 0 242.82 100" aria-label="Engram">
        <rect x="0" y="0" width="118.5" height="29.85" fill="#0A0A0A"/>
        <rect x="0" y="35.075" width="118.5" height="29.85" fill="#0A0A0A"/>
        <rect x="0" y="70.15" width="118.5" height="29.85" fill="#0A0A0A"/>
        <rect x="124.12" y="0" width="35.4" height="100" fill="#0A0A0A"/>
        <rect x="165.77" y="0" width="35.4" height="100" fill="#0A0A0A"/>
        <rect x="207.42" y="0" width="35.4" height="100" fill="#0A0A0A"/>

  </footer>

</div>

<script>

/* ════════════════════════════════════════
   BASICS — 10 verified questions
   Source: practical_test_skills_en.html (CCAF repo)
   ════════════════════════════════════════ */
const BASICS = [
  {
    tag: 'basics',
    q: "What file defines a Claude Code skill, and what is required at the top of it?",
    opts: [
      "skill.json with a JSON config block",
      "SKILL.md with YAML frontmatter containing at minimum a name and description",
      "Any .md file in the project root, no frontmatter required",
      "claude.toml with a [skill] section"
    ],
    answer: 1,
    explain: "Skills are authored as SKILL.md files with YAML frontmatter. The name and description fields are required — the description is what Claude uses to decide when the skill applies."
  },
  {
    tag: 'basics',
    q: "Why is the description field in a skill's frontmatter so important?",
    opts: [
      "It is shown in the CLI help output",
      "It controls the skill's execution order",
      "Claude reads it to decide whether the skill is relevant to the current task — vague descriptions cause skills to misfire or never trigger",
      "It is required only for skills published to a registry"
    ],
    answer: 2,
    explain: "The description is the trigger signal. A specific description (with concrete keywords and use cases) leads to accurate triggering; a vague one means the skill either never fires or fires when it shouldn't."
  },
  {
    tag: 'basics',
    q: "Where can skills live so Claude Code can discover them?",
    opts: [
      "Only in ~/.claude/skills/ (user-level)",
      "Only in .claude/skills/ inside the project",
      "User-level (~/.claude/skills/), project-level (.claude/skills/), and from installed plugins",
      "Anywhere on disk, as long as the path is in PATH"
    ],
    answer: 2,
    explain: "Skills can be user-scoped, project-scoped, or come from plugins. Project skills are great for codebase-specific workflows; user skills travel across projects."
  },
  {
    tag: 'basics',
    q: "A teammate says \"skills are just like slash commands.\" What's the most accurate correction?",
    opts: [
      "They're identical — 'skill' is just the new name for slash commands",
      "Skills are model-invoked based on context (Claude decides when to use them); slash commands are user-invoked by typing /name",
      "Skills run on the server, slash commands run locally",
      "Skills can only contain prompts, while slash commands can run tools"
    ],
    answer: 1,
    explain: "The key distinction is who invokes them. Claude decides to invoke a skill when its description matches the task; the user explicitly invokes a slash command. A skill can also be exposed as a slash command, but the trigger model is different."
  },
  {
    tag: 'basics',
    q: "You're writing a skill to help with database migrations. Which description is best?",
    opts: [
      "\"Helps with database stuff\"",
      "\"A useful skill for developers working on databases\"",
      "\"Author, review, and run Postgres schema migrations using our Alembic setup. Use when adding/altering tables, writing migration files in alembic/versions/, or troubleshooting failed migrations.\"",
      "\"Database migration skill v1.0\""
    ],
    answer: 2,
    explain: "Good descriptions are specific: they name the technology, the concrete actions the skill performs, and the trigger conditions ('Use when...'). Vague descriptions like 'helps with database stuff' won't reliably trigger."
  },
  {
    tag: 'basics',
    q: "What is progressive disclosure in the context of skills, and why does it matter?",
    opts: [
      "Skills are revealed to the user one at a time during onboarding",
      "Only the skill's name and description are loaded into context up front; the body of SKILL.md and any referenced files load only when the skill is actually invoked",
      "Skills must be enabled progressively in settings.json before they can run",
      "Long skills are automatically truncated"
    ],
    answer: 1,
    explain: "Progressive disclosure keeps the context window cheap. Claude sees a list of available skills (names + descriptions) but only pulls in the full SKILL.md content when it decides to run the skill. This is why concise descriptions and well-organized skill bodies matter."
  },
  {
    tag: 'basics',
    q: "Inside a SKILL.md body, you want to include a long reference document and an executable helper script. What's the recommended pattern?",
    opts: [
      "Inline everything into SKILL.md so it's always available",
      "Put supporting files alongside SKILL.md in the skill's folder and reference them by relative path; Claude loads them on demand",
      "Base64-encode binary helpers into the frontmatter",
      "Skills cannot reference external files — only the SKILL.md content is used"
    ],
    answer: 1,
    explain: "A skill is a folder. SKILL.md is the entrypoint, but it can reference supporting files (reference docs, scripts, templates) by relative path. Those files are loaded only when the skill is invoked, keeping context lean."
  },
  {
    tag: 'basics',
    q: "Which of the following is NOT a good fit for a skill?",
    opts: [
      "A repeatable workflow with multiple steps that Claude should follow consistently (e.g. 'review a pull request')",
      "Domain knowledge Claude needs in order to do a class of tasks well (e.g. 'GSAP animation reference')",
      "A one-off question about a specific function in this conversation",
      "A procedure that requires specific tools, scripts, or templates the user has standardized on"
    ],
    answer: 2,
    explain: "Skills are for reusable, generalizable capabilities. A one-off question is just a prompt — wrapping it in a skill adds overhead without benefit. Skills shine when the same workflow or knowledge will be needed repeatedly."
  },
  {
    tag: 'basics',
    q: "Your skill is supposed to trigger when the user works with the Claude API, but it keeps firing on unrelated OpenAI work. What's the most effective fix?",
    opts: [
      "Rename the skill to something shorter",
      "Add a SKIP clause and explicit TRIGGER signals to the description (e.g. 'TRIGGER when: imports anthropic SDK... SKIP when: imports openai')",
      "Move the skill from project-level to user-level",
      "Delete the skill and use a slash command instead"
    ],
    answer: 1,
    explain: "When a skill over-triggers, sharpen the description with explicit positive and negative signals. Naming what should NOT trigger the skill (other SDKs, unrelated filenames) is one of the most effective ways to fix misfires."
  },
  {
    tag: 'basics',
    q: "How does a skill differ from a subagent?",
    opts: [
      "They're the same thing with different names",
      "A skill is instructions/knowledge that Claude pulls into its own context to do a task; a subagent is a separate Claude instance launched with its own context window and tool set",
      "Skills can use tools but subagents cannot",
      "Subagents are deprecated and skills replace them"
    ],
    answer: 1,
    explain: "Skills extend the current Claude's behavior in-context. Subagents are independent Claude instances you delegate to — useful for isolating heavy research, parallelizing work, or protecting the main context. They complement each other."
  }
];

/* ════════════════════════════════════════
   SCENARIOS — 10 verified questions
   Source: practical_test_skills_en.html (CCAF repo)
   ════════════════════════════════════════ */
const SCENARIOS = [
  {
    tag: 'scenario',
    q: "Your `pr-review` skill triggers correctly, but on large diffs Claude skips half the checklist items. Engineer A: move the checklist into CLAUDE.md so it's always in context. Engineer B: split into `pr-review-security`, `pr-review-perf`, `pr-review-a11y`, each with its own description. Which is the better default?",
    opts: [
      "A — always-on context guarantees every item is seen on every turn",
      "B — focused sub-skills load when relevant and stay short enough to follow",
      "Neither — add 'be thorough and complete' to the existing description",

    ],
    answer: 1,
    explain: "Always-on context is a trap: large bodies loaded every turn degrade attention to any one item. Focused sub-skills load only when relevant and each stays short enough that Claude follows it carefully. 'Be thorough' is wishful tuning, not a structural fix."
  },
  {
    tag: 'scenario',
    q: "Skill `db-migrate` triggers on 'run a migration' but ALSO on 'migrate the user from team A to team B'. Description currently: 'Run database migrations.' Which change best fixes the false positive without hurting true positives?",
    opts: [
      "Lengthen it: 'Run database migrations carefully and correctly with Alembic.'",
      "Anchor to concrete systems (Alembic, alembic/versions/, DDL) and add a SKIP clause for non-DB senses of 'migrate'",

    ],
    answer: 1,

  {

    q: "A teammate proposes putting your entire 200-page engineering handbook into one skill. What's the sharpest architectural critique?",

  {
    tag: 'scenario',
    q: "You want a security-review skill that runs ONLY when explicitly requested — never spontaneously on PR reviews or edits. Your description is clear, but it still triggers on adjacent tasks. Most reliable fix?",

/* ════════════════════════════════════════
   ENGINE
   ════════════════════════════════════════ */
let QUESTIONS = [];
let current = 0;
let answers = [];

const picker = document.getElementById('picker');
const pickAll = document.getElementById('pickAll');
const card = document.getElementById('card');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');
const hint = document.getElementById('hint');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startSet(mode) {
  if (mode === 'basics') QUESTIONS = BASICS;
  else if (mode === 'scenarios') QUESTIONS = SCENARIOS;
  else if (mode === 'anatomy') QUESTIONS = ANATOMY;
  else QUESTIONS = shuffle(BASICS.concat(SCENARIOS).concat(ANATOMY));
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  picker.classList.add('hidden');
  pickAll.classList.add('hidden');
  progressWrap.classList.remove('hidden');
  card.classList.remove('hidden');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showPicker() {
  picker.classList.remove('hidden');
  pickAll.classList.remove('hidden');
  progressWrap.classList.add('hidden');
  card.classList.add('hidden');
  current = 0;
  answers = [];
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const i = current;
  const item = QUESTIONS[i];
  const answered = answers[i] !== null;
  progressBar.style.width = `${((i + (answered ? 1 : 0)) / QUESTIONS.length) * 100}%`;
  progressLabel.textContent = `${i + 1} / ${QUESTIONS.length}`;

  const tagClass = item.tag === 'scenario' ? 'scenario' : item.tag === 'anatomy' ? 'anatomy' : 'basics';
  const tagLabel = item.tag === 'scenario' ? 'scenario' : item.tag === 'anatomy' ? 'ccaf · anatomy' : 'basics';

  card.innerHTML = `
    <div class="qmeta">
      <span>Question ${i + 1} of ${QUESTIONS.length}</span>
      <span class="tag ${tagClass}">${tagLabel}</span>
    </div>
    <div class="qtext">${item.q}</div>
    <div class="opts">
      ${item.opts.map((opt, j) => {
        let cls = '';
        if (answered) {
          if (j === item.answer) cls = 'correct';
          else if (j === answers[i]) cls = 'wrong';
        }
        return `<button class="opt ${cls} ${answered ? 'disabled' : ''}" data-opt="${j}" ${answered ? 'disabled' : ''}>
          <span class="key">0${j + 1}</span>
          <span>${opt}</span>
        </button>`;
      }).join('')}
    </div>
    ${answered ? `
      <div class="explain show ${answers[i] === item.answer ? 'right' : 'miss'}">
        <div class="verdict">${answers[i] === item.answer ? 'why' : 'why'}</div>
        ${item.explain}
      </div>` : '<div class="explain"></div>'}
    <div class="controls">
      <button id="prevBtn" ${i === 0 ? 'disabled' : ''}>← back</button>
      <button class="primary" id="nextBtn" ${!answered ? 'disabled' : ''}>
        ${i === QUESTIONS.length - 1 ? 'finish →' : 'next →'}
      </button>
    </div>
  `;

  card.querySelectorAll('.opt').forEach(el => {
    if (el.classList.contains('disabled')) return;
    el.addEventListener('click', () => {
      const j = parseInt(el.dataset.opt, 10);
      answers[i] = j;
      renderQuestion();
    });
  });

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.onclick = () => { if (current > 0) { current--; renderQuestion(); } };
  nextBtn.onclick = () => {
    if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
    else renderResults();
  };
}

function renderResults() {
  progressBar.style.width = '100%';
  progressLabel.textContent = `${QUESTIONS.length} / ${QUESTIONS.length}`;
  hint.classList.add('hidden');
  const correct = answers.filter((a, i) => a === QUESTIONS[i].answer).length;
  const pct = Math.round((correct / QUESTIONS.length) * 100);
  const verdict = pct === 100 ? "Perfect score. Ready for submission."
    : pct >= 80 ? "Strong grasp. Worth one review pass on the misses."
    : pct >= 60 ? "Solid start. Read the misses, then run it again."
    : "Worth another pass through the material before workshop.";

  card.innerHTML = `
    <div class="results">
      <div class="score-line">
        <div class="score-big">${correct}<span class="total"> / ${QUESTIONS.length}</span></div>
        <div class="score-pct"><span class="num">${pct}%</span>final score</div>
      </div>

      <div class="verdict-line">${verdict.replace('.', '<span class="o">.</span>')}</div>

      <div class="review-head">review · what you got</div>
      ${QUESTIONS.map((item, i) => {
        const ok = answers[i] === item.answer;
        return `<div class="review-item ${ok ? 'ok' : 'bad'}">
          <div class="num">0${(i + 1).toString().padStart(2, '0').slice(-2)}</div>
          <div>${item.q}</div>
          <div class="mark">${ok ? 'ok' : 'miss'}</div>
        </div>`;
      }).join('')}

      <div class="results-controls">
        <button id="restartBtn" class="primary">try again</button>
        <button id="pickerBtn">change set</button>
      </div>
    </div>
  `;
  document.getElementById('restartBtn').onclick = () => {
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    hint.classList.remove('hidden');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('pickerBtn').onclick = () => {
    hint.classList.remove('hidden');
    showPicker();
  };
}

/* ════════════════════════════════════════
   WIRING
   ════════════════════════════════════════ */
picker.querySelectorAll('.pick-card').forEach(el => {
  el.addEventListener('click', () => startSet(el.dataset.mode));
});
pickAll.addEventListener('click', () => startSet('all'));

document.addEventListener('keydown', e => {
  if (card.classList.contains('hidden')) return;
  // ignore typing in inputs (none here, but defensive)
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key >= '1' && e.key <= '4') {
    const j = parseInt(e.key, 10) - 1;
    const item = QUESTIONS[current];
    if (item && answers[current] === null && j < item.opts.length) {
      answers[current] = j;
      renderQuestion();
    }
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn && !nextBtn.disabled) nextBtn.click();
  } else if (e.key === 'ArrowLeft') {
    const prevBtn = document.getElementById('prevBtn');
    if (prevBtn && !prevBtn.disabled) prevBtn.click();
  } else if (e.key === 'r' || e.key === 'R') {
    showPicker();
  }
});
</script>
