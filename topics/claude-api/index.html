<title>Engram · Claude API Knowledge Check</title>

<!--

<!-- Engram fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper:  #F6F4EF;
    --ink:    #0A0A0A;
    --orange: #E8623C;
    --rule:   1.5px;

    --display-machine:   'Doto', monospace;
    --display-editorial: 'Clash Display', 'Geist', sans-serif;
    --mono:              'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:              'Geist', 'Inter', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.5;
    min-height: 100vh;
    padding: 56px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding-bottom: 36px;
    border-bottom: var(--rule) solid var(--ink);
    margin-bottom: 56px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 18px;
  }
  .kiss { line-height: 0.78; }
  .kiss .m {
    font-family: var(--display-machine);
    font-weight: 900;
    letter-spacing: -0.02em;
    font-size: 56px;
    display: block;
  }
  .kiss .e {
    font-family: var(--display-editorial);
    font-weight: 700;
    letter-spacing: -0.045em;
    font-size: 96px;
    display: block;
    margin-top: 0;
  }
  .kiss .e .o { color: var(--orange); }

  .meta {
    text-align: right;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    line-height: 1.7;
    opacity: 0.75;
  }
  .meta .o { color: var(--orange); }
  .meta strong { font-weight: 500; opacity: 1; color: var(--ink); }

  .picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-bottom: 36px;
  }
  .pick-card {
    border: 3px solid var(--ink);
    background: var(--paper);
    padding: 36px 32px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
    text-align: left;
    font-family: var(--sans);
    font-size: 16px;
    letter-spacing: 0;
    text-transform: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 18px;
    font-weight: 400;
  }
  .pick-card:hover { transform: translateY(-2px); background: var(--ink); color: var(--paper); }
  .pick-card:hover .count { color: var(--paper); opacity: 0.6; }
  .pick-card:hover .name { color: var(--paper); }
  .pick-card:hover .name .o { color: var(--orange); }
  .pick-card:hover .desc { color: var(--paper); opacity: 0.85; }
  .pick-card .count {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  .pick-card .name {
    font-family: var(--display-editorial);
    font-weight: 700;
    font-size: 36px;
    letter-spacing: -0.025em;
    line-height: 0.95;
  }
  .pick-card .name .o { color: var(--orange); }
  .pick-card .desc {
    font-family: var(--sans);
    font-weight: 300;
    font-size: 14.5px;
    line-height: 1.45;
    opacity: 0.85;
  }

  .progress-wrap {
    border: 1.5px solid var(--ink);
    height: 14px;
    margin-bottom: 36px;
    position: relative;
  }
  .progress-bar { height: 100%; background: var(--orange); width: 0%; transition: width 0.3s ease; }
  .progress-label {
    position: absolute;
    right: 0;
    top: 22px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0.65;
  }

  .card {
    border-top: var(--rule) solid var(--ink);
    border-bottom: var(--rule) solid var(--ink);
    padding: 56px 0 64px;
  }
  .qmeta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 24px;
  }
  .qmeta .tag { padding: 6px 12px; border: 1.5px solid var(--ink); opacity: 1; }
  .qmeta .tag.tools { color: var(--ink); }
  .qmeta .tag.api { color: var(--orange); border-color: var(--orange); }
  .qmeta .tag.batch { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  .qtext {
    font-family: var(--display-editorial);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.02em;
    line-height: 1.22;
    margin-bottom: 36px;
  }
  .qtext code {
    font-family: var(--mono);
    font-size: 0.85em;
    background: rgba(10,10,10,0.06);
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 500;
  }

  .opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .opt {
    display: grid;
    grid-template-columns: 56px 1fr;
    align-items: start;
    min-height: 96px;
    padding: 22px 26px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    line-height: 1.45;
    transition: background 0.1s ease, transform 0.1s ease;
    text-align: left;
    color: inherit;
  }
  .opt code {
    font-family: var(--mono);
    font-size: 0.9em;
    background: rgba(10,10,10,0.06);
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 500;
  }
  .opt:not(.disabled):hover { background: var(--ink); color: var(--paper); border-color: var(--ink); transform: translateX(2px); }
  .opt:not(.disabled):hover code { background: rgba(255,255,255,0.12); }
  .opt:not(.disabled):hover .key { color: var(--orange); opacity: 1; }
  .opt .key {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    opacity: 0.55;
    padding-top: 2px;
  }
  .opt.correct {
    background: #15803d;
    color: #ffffff;
    border-color: #15803d;
  }
  .opt.correct code { background: rgba(255,255,255,0.18); }
  .opt.correct .key { color: #ffffff; opacity: 0.95; }
  .opt.wrong {
    background: #b91c1c;
    color: #ffffff;
    border-color: #b91c1c;
  }
  .opt.wrong code { background: rgba(255,255,255,0.18); }
  .opt.wrong .key { color: #ffffff; opacity: 0.95; }
  .opt.disabled { cursor: default; }
  .opt.disabled:hover { transform: none; background: var(--paper); }
  .opt.correct.disabled:hover { background: #15803d; color: #ffffff; }
  .opt.wrong.disabled:hover { background: #b91c1c; color: #ffffff; }

  .explain {
    margin-top: 28px;
    padding: 28px 32px;
    border-left: 4px solid var(--orange);
    background: #EFEDE7;
    font-family: var(--sans);
    font-size: 15.5px;
    line-height: 1.55;
    display: none;
  }
  .explain code {
    font-family: var(--mono);
    font-size: 0.9em;
    background: rgba(10,10,10,0.08);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .explain.show { display: block; }
  .explain .verdict {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .explain.right { border-left-color: #15803d; }
  .explain.right .verdict { color: #15803d; }
  .explain.right .verdict::before { content: '✓ correct · '; color: #15803d; }
  .explain.miss { border-left-color: #b91c1c; }
  .explain.miss .verdict { color: #b91c1c; }
  .explain.miss .verdict::before { content: '✗ not quite · '; color: #b91c1c; }
  .explain .src {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    opacity: 0.55;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 36px;
    gap: 16px;
  }
  button {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 18px 30px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.12s ease, transform 0.1s ease;
    font-weight: 500;
  }
  button:hover:not(:disabled) { background: var(--ink); color: var(--paper); transform: translateY(-1px); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:hover:not(:disabled) { background: var(--orange); border-color: var(--orange); color: var(--paper); }

  .results {
    padding: 56px 0;
  }
  .score-line {
    display: flex;
    justify-content: space-between;
    align-items: end;
    padding-bottom: 36px;
    border-bottom: var(--rule) solid var(--ink);
    margin-bottom: 36px;
  }
  .score-big {
    font-family: var(--display-editorial);
    font-weight: 700;
    font-size: 160px;
    letter-spacing: -0.045em;
    line-height: 0.85;
  }
  .score-big .total { color: var(--orange); }
  .score-pct {
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: 0.04em;
    text-align: right;
    opacity: 0.85;
  }
  .score-pct .num {
    font-family: var(--display-editorial);
    font-weight: 600;
    font-size: 48px;
    letter-spacing: -0.025em;
    display: block;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .verdict-line {
    font-family: var(--display-editorial);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.025em;
    margin-bottom: 40px;
    max-width: 720px;
    line-height: 1.25;
  }
  .verdict-line .o { color: var(--orange); }

  .review-head {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 18px;
  }
  .review-item {
    display: grid;
    grid-template-columns: 56px 1fr 80px;
    align-items: start;
    gap: 18px;
    padding: 18px 0;
    border-top: 1.5px solid rgba(10,10,10,0.18);
    font-size: 15px;
    line-height: 1.4;
  }
  .review-item .num {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.55;
  }
  .review-item .mark {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: right;
  }
  .review-item.ok .mark { color: var(--ink); }
  .review-item.ok .mark::before { content: '✓ '; color: var(--orange); }
  .review-item.bad .mark { color: var(--orange); }
  .review-item.bad .mark::before { content: '✗ '; }

  .results-controls { display: flex; gap: 16px; margin-top: 40px; }

  footer {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1.5px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    opacity: 0.65;
  }
  .mark-engram {
    display: inline-flex; align-items: center; gap: 10px;
  }
  .mark-engram svg { display: block; height: 20px; }

  .hint {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    opacity: 0.5;
    margin-top: 18px;
    text-align: center;
  }
  kbd {
    font-family: var(--mono);
    border: 1px solid var(--ink);
    padding: 1px 7px;
    font-size: 11px;
    opacity: 0.75;
  }

  .hidden { display: none !important; }

  @media (max-width: 760px) {
    body { padding: 32px 20px; }
    .kiss .m { font-size: 36px; }
    .kiss .e { font-size: 60px; }
    .picker { grid-template-columns: 1fr; }
    .opts { grid-template-columns: 1fr; }
    .qtext { font-size: 22px; }
    .score-big { font-size: 96px; }
  }
</style>
</head>

<script>

/* ════════════════════════════════════════
   TOOLS · 10 verified questions
   Source: guide_en.MD (claude-certified-architect)
   ════════════════════════════════════════ */
const TOOLS = [
  {
    tag: 'tools',
    q: "Data shows that in 12% of cases the agent skips <code>get_customer</code> and calls <code>lookup_order</code> using only the customer's name, which leads to incorrect refunds. Which change is most effective?",
    opts: [
      "Add a programmatic precondition that blocks <code>lookup_order</code> and <code>process_refund</code> until an ID is obtained from <code>get_customer</code>",
      "Improve the system prompt",
      "Add few-shot examples",
      "Implement a routing classifier"
    ],
    answer: 0,
    explain: "When critical business logic requires a specific tool sequence, software provides deterministic guarantees that prompt-based approaches (B, C) cannot. D addresses availability, not tool ordering.",
    source: "guide_en.MD Q1"
  },
  {
    tag: 'tools',
    q: "Production logs show requests like 'analyze the uploaded quarterly report' route to the web-search agent 45% of the time instead of the document analysis agent. The web-search agent has a tool <code>analyze_content</code> described as 'analyzes content and extracts key information,' while the document analysis agent has a tool <code>analyze_document</code> described as 'analyzes documents and extracts key information.' How should you fix the misrouting?",
    opts: [
      "Add a pre-routing classifier that detects whether the user refers to uploaded files or web content before the coordinator decides on delegation.",
      "Rename the web-search tool to <code>extract_web_results</code> and update its description to 'processes and returns information retrieved from web search and URLs.'",
      "Add few-shot examples to the coordinator prompt showing correct routing: 'User uploads a quarterly report -> document analysis agent' and 'User asks about a web page -> web-search agent.'",
      "Expand the document analysis tool description with usage examples like 'Use for uploaded PDFs, Word docs, and spreadsheets,' leaving the web-search tool unchanged."
    ],
    answer: 1,
    explain: "Renaming the web-search tool to <code>extract_web_results</code> and updating its description to explicitly reference web search and URLs directly removes the root cause by eliminating semantic overlap between the two tool names and descriptions. This makes each tool's purpose unambiguous, enabling the coordinator to reliably distinguish document analysis from web search.",
    source: "guide_en.MD Q7 (practice)"
  },
  {
    tag: 'tools',
    q: "You gave the document analysis agent access to a general-purpose tool <code>fetch_url</code> so it could download documents by URL. Production logs show this agent now frequently downloads search engine results pages to perform ad hoc web search, behavior that should be routed through the web-search agent, causing inconsistent results. Which fix is most effective?",
    opts: [
      "Replace <code>fetch_url</code> with a <code>load_document</code> tool that validates that URLs point to document formats.",
      "Remove <code>fetch_url</code> from the document analysis agent and route all URL fetching through the coordinator to the web-search agent.",
      "Implement filtering that blocks <code>fetch_url</code> calls to known search engine domains while allowing other URLs.",
      "Add instructions to the document analysis agent prompt that <code>fetch_url</code> should only be used to download document URLs, not to search."
    ],
    answer: 0,
    explain: "Replacing a general-purpose tool with a document-specific tool that validates URLs against document formats fixes the root cause by constraining capability at the interface level. This follows the principle of least privilege, making undesired search behavior impossible rather than merely discouraged.",
    source: "guide_en.MD Q10 (practice)"
  },
  {
    tag: 'tools',
    q: "Your CI pipeline runs the Claude Code CLI in <code>--print</code> mode using CLAUDE.md to provide project context for code review. Reviews are substantive, but developers report integration is difficult: Claude outputs narrative paragraphs that must be manually copied into PR comments. The team wants each finding posted as a separate inline PR comment at the relevant code location, which requires structured data with file path, line number, severity level, and suggested fix. Which approach is most effective?",
    opts: [
      "Add an 'Output Format for Review' section to CLAUDE.md with examples of structured findings so Claude learns the expected format from project context.",
      "Use the CLI flags <code>--output-format json</code> and <code>--json-schema</code> to enforce structured findings, then parse the output to post inline comments via the GitHub API.",
      "Include explicit formatting instructions in the review prompt requiring each finding to follow a parseable template like <code>[FILE:path] [LINE:n] [SEVERITY:level] ...</code>.",
      "Keep narrative review format but add a summarization step that uses Claude to generate a structured JSON summary of findings."
    ],
    answer: 1,
    explain: "Using <code>--output-format json</code> with <code>--json-schema</code> enforces structured output at the CLI level, guaranteeing well-formed JSON with the required fields (file path, line number, severity, suggested fix) that can be reliably parsed and posted as inline PR comments via the GitHub API. It leverages built-in CLI capabilities designed specifically for structured output.",
    source: "guide_en.MD Q16"
  },
  {
    tag: 'tools',
    q: "Production logs show that in 12% of cases your agent skips <code>get_customer</code> and calls <code>lookup_order</code> directly using only the customer-provided name, sometimes leading to misidentified accounts and incorrect refunds. What change most effectively fixes this reliability problem?",
    opts: [
      "Add few-shot examples showing that the agent always calls <code>get_customer</code> first, even when customers voluntarily provide order details.",
      "Implement a routing classifier that analyzes each request and enables only a subset of tools appropriate for that request type.",
      "Add a programmatic precondition that blocks <code>lookup_order</code> and <code>process_refund</code> until <code>get_customer</code> returns a verified customer identifier.",
      "Strengthen the system prompt stating that customer verification via <code>get_customer</code> is mandatory before any order operations."
    ],
    answer: 2,
    explain: "A programmatic precondition provides a deterministic guarantee that required sequencing is followed. It's the most effective approach because it eliminates the possibility of skipping verification, regardless of LLM behavior.",
    source: "guide_en.MD Q51"
  },
  {
    tag: 'tools',
    q: "Your <code>get_customer</code> tool returns all matches when searching by name. Currently, when there are multiple results, Claude picks the customer with the most recent order, but production data shows this selects the wrong account 15% of the time for ambiguous matches. How should you address this?",
    opts: [

/* ════════════════════════════════════════
   ENGINE
   ════════════════════════════════════════ */
let QUESTIONS = [];
let current = 0;
let answers = [];

const picker = document.getElementById('picker');
const pickAll = document.getElementById('pickAll');
const card = document.getElementById('card');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');
const hint = document.getElementById('hint');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startSet(mode) {
  if (mode === 'tools') QUESTIONS = TOOLS;
  else if (mode === 'api') QUESTIONS = API;
  else if (mode === 'batch') QUESTIONS = BATCH;
  else QUESTIONS = shuffle(TOOLS.concat(API).concat(BATCH));
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  picker.classList.add('hidden');
  pickAll.classList.add('hidden');
  progressWrap.classList.remove('hidden');
  card.classList.remove('hidden');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showPicker() {
  picker.classList.remove('hidden');
  pickAll.classList.remove('hidden');
  progressWrap.classList.add('hidden');
  card.classList.add('hidden');
  current = 0;
  answers = [];
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const i = current;
  const item = QUESTIONS[i];
  const answered = answers[i] !== null;
  progressBar.style.width = `${((i + (answered ? 1 : 0)) / QUESTIONS.length) * 100}%`;
  progressLabel.textContent = `${i + 1} / ${QUESTIONS.length}`;

  const tagClass = item.tag;
  const tagLabel = item.tag === 'api' ? 'api' : item.tag === 'batch' ? 'batch · loop' : 'tools';

  card.innerHTML = `
    <div class="qmeta">
      <span>Question ${i + 1} of ${QUESTIONS.length}</span>
      <span class="tag ${tagClass}">${tagLabel}</span>
    </div>
    <div class="qtext">${item.q}</div>
    <div class="opts">
      ${item.opts.map((opt, j) => {
        let cls = '';
        if (answered) {
          if (j === item.answer) cls = 'correct';
          else if (j === answers[i]) cls = 'wrong';
        }
        return `<button class="opt ${cls} ${answered ? 'disabled' : ''}" data-opt="${j}" ${answered ? 'disabled' : ''}>
          <span class="key">0${j + 1}</span>
          <span>${opt}</span>
        </button>`;
      }).join('')}
    </div>
    ${answered ? `
      <div class="explain show ${answers[i] === item.answer ? 'right' : 'miss'}">
        <div class="verdict">why</div>
        ${item.explain}
        <div class="src">source · ${item.source}</div>
      </div>` : '<div class="explain"></div>'}
    <div class="controls">
      <button id="prevBtn" ${i === 0 ? 'disabled' : ''}>← back</button>
      <button class="primary" id="nextBtn" ${!answered ? 'disabled' : ''}>
        ${i === QUESTIONS.length - 1 ? 'finish →' : 'next →'}
      </button>
    </div>
  `;

  card.querySelectorAll('.opt').forEach(el => {
    if (el.classList.contains('disabled')) return;
    el.addEventListener('click', () => {
      const j = parseInt(el.dataset.opt, 10);
      answers[i] = j;
      renderQuestion();
    });
  });

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.onclick = () => { if (current > 0) { current--; renderQuestion(); } };
  nextBtn.onclick = () => {
    if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
    else renderResults();
  };
}

function renderResults() {
  progressBar.style.width = '100%';
  progressLabel.textContent = `${QUESTIONS.length} / ${QUESTIONS.length}`;
  hint.classList.add('hidden');
  const correct = answers.filter((a, i) => a === QUESTIONS[i].answer).length;
  const pct = Math.round((correct / QUESTIONS.length) * 100);
  const verdict = pct === 100 ? "Perfect score. Ready for submission."
    : pct >= 80 ? "Strong grasp. Worth one review pass on the misses."
    : pct >= 60 ? "Solid start. Read the misses, then run it again."
    : "Worth another pass through the material before workshop.";

  card.innerHTML = `
    <div class="results">
      <div class="score-line">
        <div class="score-big">${correct}<span class="total"> / ${QUESTIONS.length}</span></div>
        <div class="score-pct"><span class="num">${pct}%</span>final score</div>
      </div>

      <div class="verdict-line">${verdict.replace('.', '<span class="o">.</span>')}</div>

      <div class="review-head">review · what you got</div>
      ${QUESTIONS.map((item, i) => {
        const ok = answers[i] === item.answer;
        return `<div class="review-item ${ok ? 'ok' : 'bad'}">
          <div class="num">0${(i + 1).toString().padStart(2, '0').slice(-2)}</div>
          <div>${item.q}</div>
          <div class="mark">${ok ? 'ok' : 'miss'}</div>
        </div>`;
      }).join('')}

      <div class="results-controls">
        <button id="restartBtn" class="primary">try again</button>
        <button id="pickerBtn">change set</button>
      </div>
    </div>
  `;
  document.getElementById('restartBtn').onclick = () => {
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    hint.classList.remove('hidden');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('pickerBtn').onclick = () => {
    hint.classList.remove('hidden');
    showPicker();
  };
}

picker.querySelectorAll('.pick-card').forEach(el => {
  el.addEventListener('click', () => startSet(el.dataset.mode));
});
pickAll.addEventListener('click', () => startSet('all'));

document.addEventListener('keydown', e => {
  if (card.classList.contains('hidden')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key >= '1' && e.key <= '4') {
    const j = parseInt(e.key, 10) - 1;
    const item = QUESTIONS[current];
    if (item && answers[current] === null && j < item.opts.length) {
      answers[current] = j;
      renderQuestion();
    }
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn && !nextBtn.disabled) nextBtn.click();
  } else if (e.key === 'ArrowLeft') {
    const prevBtn = document.getElementById('prevBtn');
    if (prevBtn && !prevBtn.disabled) prevBtn.click();
  } else if (e.key === 'r' || e.key === 'R') {
    showPicker();
  }
});
</script>
</body>
</html>
